services:
  - type: web
    name: cfa-api
    runtime: python
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "uvicorn cfa.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: MODELS_DIR
        value: /opt/render/project/src/models
