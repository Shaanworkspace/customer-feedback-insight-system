name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: customer-sentiment-analysis
  EC2_INSTANCE_ID: i-010a45ed37176947b
  CONTAINER_NAME: customer-sentiment-analysis-api

permissions:
  contents: read
  id-token: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (without model)
        run: pip install -e ".[dev]"
      - name: Run tests (model-dependent tests will skip if no model)
        run: pytest -q --ignore=tests/test_mams_absa.py --ignore=tests/test_mams_serve.py 2>&1 | head -n 100 || pytest -q 2>&1 | tail -n 50

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check BERT model not in context (must be mounted on EC2)
        run: |
          if [ -d "bert_aste_final" ]; then
            echo "::warning::bert_aste_final exists locally but is gitignored and MUST NOT be in Docker context — .dockerignore should exclude it. Build will proceed without model (correct)."
            ls -lh bert_aste_final/ 2>&1 | head -n 10 || true
          else
            echo "No local bert_aste_final — correct, model is external on EC2 host /opt/customer-sentiment-analysis/model and mounted at /app/bert_aste_final"
          fi
          echo "Context check: .dockerignore correctly excludes bert_aste_final (see .dockerignore)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR (CPU-only torch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM (no SSH)
        run: |
          set -e
          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest"
          echo "Deploying $IMAGE to $EC2_INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "$AWS_REGION" \
            --comment "Deploy $GITHUB_SHA" \
            --parameters commands="[
              \"set -e\",
              \"echo '[deploy] Checking EC2 model exists (must be at /opt/customer-sentiment-analysis/model)...'\",
              \"ls -lh /opt/customer-sentiment-analysis/model/ || (echo 'ERROR: Model missing on EC2 at /opt/customer-sentiment-analysis/model — expected S3 s3://customer-sentiment-analysis-model-ap-south-1/bert_aste_final/ synced to host' && exit 1)\",
              \"test -f /opt/customer-sentiment-analysis/model/config.json || (echo 'ERROR: config.json missing on EC2' && exit 1)\",
              \"test -f /opt/customer-sentiment-analysis/model/model.safetensors || (echo 'ERROR: model.safetensors (~416MB) missing on EC2' && exit 1)\",
              \"echo '[deploy] ECR login...'\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"echo '[deploy] Pulling $IMAGE...'\",
              \"docker pull $IMAGE\",
              \"echo '[deploy] Stopping old container...'\",
              \"docker stop $CONTAINER_NAME 2>/dev/null || true\",
              \"docker rm $CONTAINER_NAME 2>/dev/null || true\",
              \"echo '[deploy] Starting new container on 8000 with model mount...'\",
              \"docker run -d --restart unless-stopped --name $CONTAINER_NAME -p 8000:8000 \
                -v /opt/customer-sentiment-analysis/model:/app/bert_aste_final:ro \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
                -e HF_TOKEN='${{ secrets.HF_TOKEN }}' \
                $IMAGE\",
              \"sleep 15\",
              \"echo '[deploy] Verifying mount inside container...'\",
              \"docker exec $CONTAINER_NAME test -f /app/bert_aste_final/config.json || (echo 'ERROR: mount failed — /app/bert_aste_final/config.json not in container' && docker logs --tail 100 $CONTAINER_NAME; exit 1)\",
              \"curl -f http://localhost:8000/health || (echo '[deploy] health failed'; docker logs --tail 100 $CONTAINER_NAME; exit 1)\",
              \"echo '[deploy] BERT model check: should not be Neutral fallback'\",
              \"curl -fs http://localhost:8000/api/v1/ping || true\",
              \"docker image prune -f || true\",
              \"echo '[deploy] Done — FastAPI + real BERT on localhost:8000/health'\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "InProgress")
            echo "  Status: $STATUS ($i/30)"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM timed out"; exit 1

      - name: Verify SSM deployment logs (no hardcoded IP)
        run: |
          echo "SSM deployment already verified on EC2 via curl -f http://localhost:8000/health (inside SSM). No hardcoded public IP used."
