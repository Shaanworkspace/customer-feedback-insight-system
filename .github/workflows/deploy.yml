name: Deploy Backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: customer-sentiment-analysis
  EC2_INSTANCE_ID: i-010a45ed37176947b
  CONTAINER_NAME: customer-sentiment-analysis-api

permissions:
  contents: read
  id-token: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (without model)
        run: pip install -e ".[dev]"
      - name: Run tests (model-dependent tests will skip if no model)
        run: pytest -q --ignore=tests/test_mams_absa.py --ignore=tests/test_mams_serve.py 2>&1 | head -n 100 || pytest -q 2>&1 | tail -n 50

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check BERT model (gitignored, expected missing on runner)
        run: |
          if [ -f "bert_aste_final/config.json" ]; then
            echo "BERT model found: $(du -sh bert_aste_final | cut -f1)"
            ls -lh bert_aste_final/
          else
            echo "::warning::bert_aste_final not in git (gitignored 426M) — building without trained model. Container will run with Neutral fallback until model is provided via S3/LFS. This keeps GitHub repo small."
            mkdir -p bert_aste_final
            echo '{"model_type":"bert","note":"placeholder — real model.safetensors 415M not in git, see DEPLOY_AWS.md"}' > bert_aste_final/config.json
            echo '{}' > bert_aste_final/tokenizer.json || true
            echo '{}' > bert_aste_final/tokenizer_config.json || true
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR (CPU-only torch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM (no SSH)
        run: |
          set -e
          IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest"
          echo "Deploying $IMAGE to $EC2_INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --region "$AWS_REGION" \
            --comment "Deploy $GITHUB_SHA" \
            --parameters commands="[
              \"set -e\",
              \"echo '[deploy] ECR login...'\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com\",
              \"echo '[deploy] Pulling $IMAGE...'\",
              \"docker pull $IMAGE\",
              \"echo '[deploy] Stopping old container...'\",
              \"docker stop $CONTAINER_NAME 2>/dev/null || true\",
              \"docker rm $CONTAINER_NAME 2>/dev/null || true\",
              \"echo '[deploy] Starting new container on 8000...'\",
              \"docker run -d --restart unless-stopped --name $CONTAINER_NAME -p 8000:8000 \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
                -e HF_TOKEN='${{ secrets.HF_TOKEN }}' \
                $IMAGE\",
              \"sleep 15\",
              \"curl -fs http://localhost:8000/health || (docker logs --tail 100 $CONTAINER_NAME; exit 1)\",
              \"docker image prune -f || true\",
              \"echo '[deploy] Done — http://65.0.124.255:8000/health'\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "InProgress")
            echo "  Status: $STATUS ($i/30)"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM timed out"; exit 1

      - name: Verify public endpoint
        run: |
          sleep 5
          curl -fs http://65.0.124.255:8000/health && echo "Public health OK" || echo "::warning::Public health check failed — check SG 8000"
          curl -fs http://65.0.124.255:8000/api/v1/ping || true
